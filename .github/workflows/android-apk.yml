name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - master
      - 'feature/sf2-preset-browser'
      - android-apk-player
      - 'feature/usb-midi-input'
      - 'feature/ble-midi-input'
      - 'feature/multitrack-midi'
      - 'fix/phase1-multitrack-stability'
      - 'feature/polyphony-control'
      - 'feature/two-screen-midi-settings'
      - 'review/feedback-atualizado'
      - 'fix/audio-midi-stability'
      - 'feature/global-effects-tab'
      - 'feature/ux-phase-1-midi-screen'
      - 'feature/ux-phase-2-midi-controls'
      - 'feature/ux-phase-3-library-settings'
      - 'feature/ux-phase-4-effects-presets'
      - 'feature/ux-phase-5-polish'
      - 'feature/ux-responsive-mixer'
      - 'docs/consolidated-portugues-br'
    paths:
      - 'android-app/**'
      - 'src/**'
      - 'include/**'
      - 'android/**'
      - 'CMakeLists.txt'
      - '.github/workflows/android-apk.yml'
      - 'README*'
      - 'LICENSE*'
      - 'CONTRIBUTING.md'
      - 'ARCHITECTURE.md'
      - 'TODO*'
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fluidsynth-player-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
