name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - master
      - 'feature/sf2-preset-browser'
      - android-apk-player
      - 'feature/usb-midi-input'
      - 'feature/ble-midi-input'
      - 'feature/multitrack-midi'
      - 'fix/phase1-multitrack-stability'
      - 'feature/polyphony-control'
      - 'feature/two-screen-midi-settings'
      - 'review/feedback-atualizado'
      - 'fix/audio-midi-stability'
      - 'feature/global-effects-tab'
      - 'feature/ux-phase-1-midi-screen'
      - 'feature/ux-phase-2-midi-controls'
      - 'feature/ux-phase-3-library-settings'
      - 'feature/ux-phase-4-effects-presets'
      - 'feature/ux-phase-5-polish'
      - 'feature/ux-responsive-mixer'
      - 'docs/consolidated-portugues-br'
    paths:
      - 'android-app/**'
      - 'src/**'
      - 'include/**'
      - 'android/**'
      - 'CMakeLists.txt'
      - '.github/workflows/android-apk.yml'
      - 'README*'
      - 'LICENSE*'
      - 'CONTRIBUTING.md'
      - 'ARCHITECTURE.md'
      - 'TODO*'
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify 16 KB ELF and APK alignment
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          NDK_BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          mapfile -t LIBS < <(unzip -Z1 "$APK" | grep -E '^lib/[^/]+/[^/]+[.]so      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fluidsynth-player-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
)
          test "${#LIBS[@]}" -gt 0

          for LIB in "${LIBS[@]}"; do
            OUT="$TMP_DIR/$(basename "$LIB")"
            unzip -p "$APK" "$LIB" > "$OUT"
            echo "Checking $LIB"
            "$NDK_BIN/llvm-readelf" -l "$OUT" | awk '
              function hexnum(s, i, c, n, d) {
                sub(/^0x/, "", s)
                n = 0
                for (i = 1; i <= length(s); i++) {
                  c = tolower(substr(s, i, 1))
                  d = index("0123456789abcdef", c) - 1
                  if (d < 0) return 0
                  n = n * 16 + d
                }
                return n
              }
              $1 == "LOAD" {
                align = $NF
                if (hexnum(align) < 16384) {
                  printf "ERROR: LOAD alignment %s is below 16 KB\\n", align
                  failed = 1
                }
                found = 1
              }
              END {
                if (!found) {
                  print "ERROR: no LOAD segments found"
                  failed = 1
                }
                exit failed
              }'
            if [[ "$LIB" == */libplayer.so ]]; then
              strings "$OUT" | grep -Fq "2.6.3"
            fi
          done

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fluidsynth-player-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
