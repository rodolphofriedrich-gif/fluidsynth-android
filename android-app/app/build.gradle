plugins { id 'com.android.application' }

android {
    namespace 'com.rodolphofriedrich.fluidsynth'
    compileSdk 35
    defaultConfig {
        applicationId 'com.rodolphofriedrich.fluidsynth'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -O3'; arguments '-DANDROID_STL=c++_shared' }
        }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
}
