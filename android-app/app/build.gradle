plugins { id 'com.android.application' }

android {
    namespace 'com.rodolphofriedrich.fluidsynth'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.rodolphofriedrich.fluidsynth'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -O3'; arguments '-DANDROID_STL=c++_shared' }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    externalNativeBuild { cmake { path '../../CMakeLists.txt'; version '3.22.1' } }
}

dependencies {
    implementation 'jp.kshoji:ble-midi:0.0.21'
}
